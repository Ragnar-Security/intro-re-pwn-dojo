        intro dojos cover the same ideas in much more depth).
      - [Linux x86-64 syscall table (Chromium OS docs)](https://chromium.googlesource.com/chromiumos/docs/+/master/constants/syscalls.md#x86_64-64_bit) lists every syscall number and its argument registers.
      - `man 2 write`, `man 2 open`, `man 2 setreuid`, `man 2 execve`: the
        manual pages for each syscall.
